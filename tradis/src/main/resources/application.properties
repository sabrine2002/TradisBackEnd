spring.application.name=Tradis
# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/Tradis?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
server.port=8085
# Pilote JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# SQL script initialization
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:script.sql
# mailer
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sabrinezaddem18@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
